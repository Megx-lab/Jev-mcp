services:
  - type: web
    name: jev-mcp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: TYPESAFE_API_KEY
        sync: false
      - key: SERVER_PASSWORD
        generateValue: true
